name: FillMeNow stable markers and truck-only native QA
on:
  push:
    branches: [fix/native-markers-truck-only-20261011]
    paths: ['native/station-map-*', 'tools/native-marker-*', '.github/workflows/native-marker-qa.yml']
permissions:
  contents: read
concurrency:
  group: fillmenow-native-marker-qa
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare candidate and test strict facility rules
        run: |
          node tools/native-marker-prepare.mjs
          node tools/native-marker-test-prepare.cjs
          node tools/direct-native-unit.mjs
          git diff --check
          git diff --exit-code 8907522e737ac71bccd2452733da58f1933a0ef5 -- web backend ios native/entry.mjs native/location-facade.mjs
      - name: Install isolated browser tools
        run: |
          mkdir -p /tmp/fmn-layout
          npm install --prefix /tmp/fmn-layout --ignore-scripts --no-audit --no-fund playwright@1.56.1
          /tmp/fmn-layout/node_modules/.bin/playwright install --with-deps chromium webkit >/dev/null
      - name: Dense pins, price-refresh stability and strict truck results
        env:
          NODE_PATH: /tmp/fmn-layout/node_modules
        run: node tools/native-marker-browser.cjs
      - name: Set up Android tools
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o /tmp/gradle.zip
          EXPECTED="$(curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL https://services.gradle.org/distributions/gradle-8.14.3-bin.zip.sha256)"
          echo "$EXPECTED  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
          echo /tmp/gradle-8.14.3/bin >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' >/dev/null
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Build release and installed-app tests with lint
        run: gradle -p android --no-daemon :app:assembleRelease :app:assembleReleaseAndroidTest :app:lintRelease --stacktrace
      - name: Sign emulator copies without owner credentials
        run: |
          set -euo pipefail
          mkdir -p native-marker-package native-marker-qa
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk native-marker-package/FillMeNow-markers-unsigned.apk
          cp "$BT/lib/apksigner.jar" native-marker-package/
          "$BT/aapt" dump badging native-marker-package/FillMeNow-markers-unsigned.apk > native-marker-qa/apk-badging.txt
          "$BT/aapt" dump permissions native-marker-package/FillMeNow-markers-unsigned.apk > native-marker-qa/permissions.txt
          ! grep -q ACCESS_BACKGROUND_LOCATION native-marker-qa/permissions.txt
          keytool -genkeypair -keystore /tmp/emulator-only.jks -storepass emulator-only-pass -keypass emulator-only-pass -alias qa -dname 'CN=Disposable Emulator Test' -keyalg RSA -validity 2 >/dev/null 2>&1
          "$BT/apksigner" sign --ks /tmp/emulator-only.jks --ks-pass pass:emulator-only-pass --out /tmp/fmn-app.apk native-marker-package/FillMeNow-markers-unsigned.apk
          TEST_APK="$(find android/app/build/outputs/apk/androidTest -name '*.apk' | head -1)"
          "$BT/apksigner" sign --ks /tmp/emulator-only.jks --ks-pass pass:emulator-only-pass --out /tmp/fmn-test.apk "$TEST_APK"
      - name: Start disposable Android emulator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          export ANDROID_USER_HOME="$HOME/.android" ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n fmn-markers -k 'system-images;android-35;google_apis;x86_64' --device pixel_6
          nohup "$ANDROID_HOME/emulator/emulator" -avd fmn-markers -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > /tmp/fmn-markers-emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 90); do test "$(timeout 5 adb shell getprop sys.boot_completed | tr -d '\r')" = 1 && break; sleep 2; done
          test "$(timeout 5 adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Verify native GPS-to-map, truck markers and safe-area screens
        timeout-minutes: 8
        run: |
          set -euo pipefail
          adb install /tmp/fmn-app.apk
          adb install /tmp/fmn-test.apk
          python3 - <<'PY' &
          import subprocess,time
          for i in range(480):
              subprocess.run(['adb','emu','geo','fix',str(153.025+(i%80)*.0001),'-27.47'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              time.sleep(1)
          PY
          FEED=$!
          trap 'kill "$FEED" 2>/dev/null || true' EXIT
          timeout 420 adb shell am instrument -w -r au.com.fillmenow.app.test/androidx.test.runner.AndroidJUnitRunner | tee native-marker-qa/instrumentation.txt
          grep -q 'OK (2 tests)' native-marker-qa/instrumentation.txt
      - name: Record passing source and unsigned signing payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/native-markers-truck-only-20261011
          git add android/build.gradle android/settings.gradle android/app/build.gradle android/app/proguard-rules.pro android/app/src/main/AndroidManifest.xml android/app/src/main/java android/app/src/main/res/values/styles.xml android/app/src/androidTest/java/au/com/fillmenow/app/NativeMapTest.java android/app/src/androidTest/java/au/com/fillmenow/app/NativePolishTest.java native/package.json native/package-lock.json native/capacitor.config.json tools/native-marker-browser.cjs
          if ! git diff --cached --quiet; then
            git -c user.name='FillMeNow QA' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record tested 1.2.2 native markers and facility gate [skip ci]'
            git -c credential.helper='!gh auth git-credential' push origin HEAD:refs/heads/fix/native-markers-truck-only-20261011
          fi
          git rev-parse HEAD > native-marker-package/source-commit.txt
          cp native-marker-qa/instrumentation.txt native-marker-package/
          (cd native-marker-package && sha256sum *.apk *.jar > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FillMeNow-native-markers-passing-build
          path: native-marker-package/
          retention-days: 7
      - name: Preserve reports and actual screenshots
        if: always()
        timeout-minutes: 1
        run: |
          mkdir -p native-marker-qa
          cp -r marker-browser-qa native-marker-qa/ 2>/dev/null || true
          timeout 15 adb pull /sdcard/Android/data/au.com.fillmenow.app/files/native-map-qa native-marker-qa/ || true
          timeout 15 adb pull /sdcard/Android/data/au.com.fillmenow.app/files/native-polish-qa native-marker-qa/ || true
          cp android/app/build/reports/lint-results-release.* native-marker-qa/ 2>/dev/null || true
          cp /tmp/fmn-markers-emulator.log native-marker-qa/ 2>/dev/null || true
          timeout 10 adb logcat -d -t 400 > native-marker-qa/emulator-log.txt 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: FillMeNow-native-markers-evidence
          path: native-marker-qa/
          retention-days: 7
      - name: Stop emulator
        if: always()
        timeout-minutes: 1
        run: timeout 10 adb emu kill || true
