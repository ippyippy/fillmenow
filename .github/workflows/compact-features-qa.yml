name: FillMeNow 80 percent scale and collapsible panels regression
on:
  push:
    branches: [feature/compact-features-20261011]
permissions:
  contents: read
concurrency:
  group: fillmenow-compact-features
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build packaged native UI while preserving GPS
        run: |
          node tools/native-scaled-panels-prepare.mjs
          node tools/truck-network-test.cjs
          node tools/cheapest-band-test.cjs
          node tools/direct-native-unit.mjs
          git diff --check
          git diff --exit-code 244f8f1aadc10b1bcf0044c57371a8a8ba1e0ca4 -- backend ios native/entry.mjs native/location-facade.mjs
      - name: Install isolated browser tests
        run: |
          mkdir -p /tmp/fmn-layout
          npm install --prefix /tmp/fmn-layout --ignore-scripts --no-audit --no-fund playwright@1.56.1
          /tmp/fmn-layout/node_modules/.bin/playwright install --with-deps chromium webkit >/dev/null
      - name: Verify button navigation, layout spacing, unified Search, markers and settings
        env:
          NODE_PATH: /tmp/fmn-layout/node_modules
        run: |
          node tools/native-map-clarity-test.cjs
          node tools/native-unified-search-test.cjs
          node tools/native-ux-controls-test.cjs
          node tools/native-scaled-panels-test.cjs
      - name: Set up pinned Android tools
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o /tmp/gradle.zip
          EXPECTED="$(curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL https://services.gradle.org/distributions/gradle-8.14.3-bin.zip.sha256)"
          echo "$EXPECTED  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
          echo /tmp/gradle-8.14.3/bin >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' >/dev/null
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Compile release APK and native tests
        run: gradle -p android --no-daemon :app:assembleRelease :app:assembleReleaseAndroidTest :app:lintRelease --stacktrace
      - name: Sign disposable emulator copies
        run: |
          set -euo pipefail
          mkdir -p ux-package ux-evidence
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk ux-package/FillMeNow-scaled-panels-unsigned.apk
          cp "$BT/lib/apksigner.jar" ux-package/
          "$BT/aapt" dump badging ux-package/FillMeNow-scaled-panels-unsigned.apk > ux-evidence/apk-badging.txt
          "$BT/aapt" dump permissions ux-package/FillMeNow-scaled-panels-unsigned.apk > ux-evidence/permissions.txt
          ! grep -q ACCESS_BACKGROUND_LOCATION ux-evidence/permissions.txt
          keytool -genkeypair -keystore /tmp/emulator-only.jks -storepass emulator-only-pass -keypass emulator-only-pass -alias qa -dname 'CN=Disposable Emulator Test' -keyalg RSA -validity 2 >/dev/null 2>&1
          "$BT/apksigner" sign --ks /tmp/emulator-only.jks --ks-pass pass:emulator-only-pass --out /tmp/fmn-app.apk ux-package/FillMeNow-scaled-panels-unsigned.apk
          TEST_APK="$(find android/app/build/outputs/apk/androidTest -name '*.apk' | head -1)"
          "$BT/apksigner" sign --ks /tmp/emulator-only.jks --ks-pass pass:emulator-only-pass --out /tmp/fmn-test.apk "$TEST_APK"
      - name: Start disposable Android emulator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          export ANDROID_USER_HOME="$HOME/.android" ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n fmn-ux -k 'system-images;android-35;google_apis;x86_64' --device pixel_6
          nohup "$ANDROID_HOME/emulator/emulator" -avd fmn-ux -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > /tmp/fmn-ux-emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 90); do test "$(timeout 5 adb shell getprop sys.boot_completed | tr -d '\r')" = 1 && break; sleep 2; done
          test "$(timeout 5 adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Test native GPS-to-map, system bars, keyboard and native truck-only mode
        timeout-minutes: 8
        run: |
          set -euo pipefail
          adb install /tmp/fmn-app.apk
          adb install /tmp/fmn-test.apk
          python3 - <<'PY' &
          import subprocess,time
          for i in range(480):
              subprocess.run(['adb','emu','geo','fix',str(153.025+(i%80)*.0001),'-27.47'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              time.sleep(1)
          PY
          FEED=$!
          trap 'kill "$FEED" 2>/dev/null || true' EXIT
          timeout 420 adb shell am instrument -w -r au.com.fillmenow.app.test/androidx.test.runner.AndroidJUnitRunner | tee ux-evidence/instrumentation.txt
          grep -q 'OK (2 tests)' ux-evidence/instrumentation.txt
      - name: Record passing unsigned package and source recipe
        run: |
          git rev-parse HEAD > ux-package/source-commit.txt
          cp ux-evidence/instrumentation.txt ux-package/
          git diff -- android native/capacitor.config.json > ux-package/generated-build.patch
          (cd ux-package && sha256sum *.apk *.jar > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FillMeNow-scaled-panels-passing-build
          path: ux-package/
          retention-days: 7
      - name: Preserve screenshots and reports
        if: always()
        timeout-minutes: 1
        run: |
          mkdir -p ux-evidence
          cp -r map-clarity-qa ux-evidence/ 2>/dev/null || true
          cp -r unified-search-qa ux-evidence/ 2>/dev/null || true
          cp -r native-ux-qa ux-evidence/ 2>/dev/null || true
          cp -r scaled-panels-qa ux-evidence/ 2>/dev/null || true
          timeout 15 adb pull /sdcard/Android/data/au.com.fillmenow.app/files/native-map-qa ux-evidence/ || true
          timeout 15 adb pull /sdcard/Android/data/au.com.fillmenow.app/files/native-polish-qa ux-evidence/ || true
          cp android/app/build/reports/lint-results-release.* ux-evidence/ 2>/dev/null || true
          cp /tmp/fmn-ux-emulator.log ux-evidence/ 2>/dev/null || true
          timeout 10 adb logcat -d -t 400 > ux-evidence/emulator-log.txt 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: FillMeNow-scaled-panels-evidence
          path: ux-evidence/
          retention-days: 7
      - name: Stop emulator
        if: always()
        timeout-minutes: 1
        run: timeout 10 adb emu kill || true
