name: FillMeNow unified Search Android check
on:
  push:
    branches: [feature/native-unified-search-complete-20261011]
    paths:
      - "native/unified-search.*"
      - "tools/native-unified-search-*"
      - ".github/workflows/native-unified-search-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare native Search on map-clarity base
        run: |
          set -euo pipefail
          node tools/native-unified-search-prepare.mjs
          node tools/map-clarity-native-test-prepare.mjs
          node tools/direct-native-unit.mjs
          git diff --check
          git diff --exit-code 20633073f4612d559d238d8cde528c61f5a49a8a -- web backend ios native/entry.mjs native/location-facade.mjs
      - name: Install browser QA tools
        run: |
          mkdir -p /tmp/fmn-layout
          npm install --prefix /tmp/fmn-layout --ignore-scripts --no-audit --no-fund playwright@1.56.1
          /tmp/fmn-layout/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify Search and native map UX
        env:
          NODE_PATH: /tmp/fmn-layout/node_modules
        run: |
          node tools/native-map-clarity-test.cjs
          node tools/native-unified-search-test.cjs
      - name: Set up Android build tools
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o /tmp/gradle.zip
          EXPECTED="$(curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL https://services.gradle.org/distributions/gradle-8.14.3-bin.zip.sha256)"
          echo "$EXPECTED  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
          echo /tmp/gradle-8.14.3/bin >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' >/dev/null
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Compile Android release and tests
        run: gradle -p android --no-daemon :app:assembleRelease :app:assembleReleaseAndroidTest :app:lintRelease
      - name: Install and test on emulator
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p qa
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk qa/FillMeNow-1.2.3-unified-unsigned.apk
          keytool -genkeypair -keystore /tmp/disposable-ci-key.jks -storepass ci-only-pass -keypass ci-only-pass -alias qa -dname 'CN=Disposable QA' -keyalg RSA -validity 2 >/dev/null 2>&1
          "$BT/apksigner" sign --ks /tmp/disposable-ci-key.jks --ks-pass pass:ci-only-pass --out /tmp/fmn-app.apk qa/FillMeNow-1.2.3-unified-unsigned.apk
          TEST_APK="$(find android/app/build/outputs/apk/androidTest -name '*.apk' | head -1)"
          "$BT/apksigner" sign --ks /tmp/disposable-ci-key.jks --ks-pass pass:ci-only-pass --out /tmp/fmn-test.apk "$TEST_APK"
          sudo chmod 666 /dev/kvm
          export ANDROID_USER_HOME="$HOME/.android" ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n fmn-search -k 'system-images;android-35;google_apis;x86_64' --device pixel_6
          nohup "$ANDROID_HOME/emulator/emulator" -avd fmn-search -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > /tmp/fmn-search-emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 90); do test "$(timeout 5 adb shell getprop sys.boot_completed | tr -d '\r')" = 1 && break; sleep 2; done
          test "$(timeout 5 adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install /tmp/fmn-app.apk
          adb install /tmp/fmn-test.apk
          python3 - <<'PY' &
          import subprocess,time
          for i in range(450):
              subprocess.run(['adb','emu','geo','fix',str(153.025+(i%80)*.0001),'-27.47'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              time.sleep(1)
          PY
          FEED=$!
          trap 'kill "$FEED" 2>/dev/null || true; timeout 10 adb emu kill || true' EXIT
          timeout 420 adb shell am instrument -w -r au.com.fillmenow.app.test/androidx.test.runner.AndroidJUnitRunner | tee qa/instrumentation.txt
          grep -q 'OK (2 tests)' qa/instrumentation.txt
      - name: Store passing unsigned build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FillMeNow-unified-Search-unsigned-build
          path: qa/
          retention-days: 7
